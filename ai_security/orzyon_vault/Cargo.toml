[package]
name = "sgt_vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Duas targets. A lib tem TODA a lógica; o binário é fino.
# É isto que permite `tests/` enxergar o sistema. Ver lib.rs.
[lib]
name = "sgt_vault"
path = "src/lib.rs"

[[bin]]
name = "sgt_vault"
path = "src/main.rs"

[dependencies]
# --- web ---
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# --- mTLS ---
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
x509-parser = "0.16"

# --- cripto ---
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# --- serde ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- infra ---
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
config = "0.15.25"

[profile.release]
# Vault guarda chave em RAM. Panic = unwind = destrutores rodam = Zeroize roda.
# `panic = "abort"` PULA os destrutores e deixa a chave na memória do core dump.
# Nunca use abort neste crate.
panic = "unwind"