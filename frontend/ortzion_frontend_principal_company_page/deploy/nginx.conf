# Idioma inicial pelo Accept-Language do navegador.
# Simplificação deliberada: olha só o começo do header (o 1º idioma).
map $http_accept_language $idioma_inicial {
  default /pt/;
  ~*^en   /en/;
  ~*^es   /es/;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Raiz: redireciona para o idioma do navegador (/pt/, /en/ ou /es/)
  location = / {
    return 302 $idioma_inicial;
  }

  # Assets com hash no nome: cache longo
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|ico)$ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # 21 páginas prerenderizadas (/{pt,en,es}/<slug>); fallback em PT
  location / {
    expires -1;
    try_files $uri $uri/ /pt/index.html;
  }
}
