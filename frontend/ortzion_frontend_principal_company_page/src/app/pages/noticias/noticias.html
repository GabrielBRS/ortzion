@if (cs.conteudo(); as t) {
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">{{ t.noticias.eyebrow }}</p>
      <h1>{{ t.noticias.titulo }}</h1>
      <p class="lede">{{ t.noticias.lede }}</p>
    </div>
  </section>

  <!-- TODO: editar/adicionar itens em core/i18n/conteudo-*.ts (bloco `noticias.itens`) -->
  <section class="section">
    <div class="container">
      <div class="grid grid-2">
        @for (item of t.noticias.itens; track item.titulo) {
          <article class="card">
            <p class="card-tag">{{ item.data }}</p>
            <h3>{{ item.titulo }}</h3>
            <p>{{ item.resumo }}</p>
          </article>
        }
      </div>
      <p class="note-confidencial">
        {{ t.noticias.nota }}
        <a [routerLink]="cs.linkPara('contato')" class="link-arrow">{{ t.noticias.notaLink }}</a>
      </p>
    </div>
  </section>
}
