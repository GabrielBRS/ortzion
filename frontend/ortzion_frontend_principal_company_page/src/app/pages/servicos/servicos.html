@if (cs.conteudo(); as t) {
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">{{ t.servicos.eyebrow }}</p>
      <h1>{{ t.servicos.titulo }}</h1>
      <p class="lede">{{ t.servicos.lede }}</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-2">
        @for (servico of t.servicos.itens; track servico.titulo) {
          <article class="card">
            <h3>{{ servico.titulo }}</h3>
            <p>{{ servico.texto }}</p>
          </article>
        }
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container cta-band">
      <h2>{{ t.servicos.cta.titulo }}</h2>
      <p>{{ t.servicos.cta.texto }}</p>
      <a [routerLink]="cs.linkPara('contato')" class="btn btn-solid">{{ t.servicos.cta.botao }}</a>
    </div>
  </section>
}
