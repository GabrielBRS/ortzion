map $http_accept_language $idioma_raiz {
    default /pt/;
    ~*^en   /en/;
    ~*^es   /es/;
    ~*^pt   /pt/;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/plain
        application/xml
        application/rss+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health check do container
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets gerados pelo Vite possuem hash e podem ser cacheados por longo prazo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Outros arquivos estáticos.
    location ~* \.(?:woff2?|ttf|svg|png|jpg|jpeg|webp|avif|ico|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Acesso à raiz segue para o idioma preferido.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Vary Accept-Language always;
        return 302 $idioma_raiz;
    }

    # React/Vite SPA:
    # /pt/, /en/, /es/, /pt/consultoria etc. caem no index.html
    # e o React Router resolve a rota no cliente.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
