[package]
name = "orzyon_data_application_cache"
version = "0.1.0"
edition = "2021"
description = "In-memory, namespaced key-value cache service with a gRPC API for the Orzyon AI Cloud platform."
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
moka = { version = "0.12", features = ["future"] }
prost = "0.13"
prost-types = "0.13"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.13"
